name: Deploy Django to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Deploy to EC2 via SSH Action
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/ubuntu/xScout
          
          # Pull the latest code and forcefully overwrite
          git fetch origin main
          git reset --hard origin/main
          
          # Rebuild and restart the Docker containers
          sudo systemctl stop nginx || true
          docker-compose down --remove-orphans
          docker rm -f xscout_web xscout_nginx || true
          docker-compose build
          docker-compose up -d
          
          # Wait securely for app to boot and dump error logs to GitHub
          sleep 5
          docker logs xscout_web
          
          # Run Django migrations and collect static files
          docker-compose exec -T web python manage.py migrate --noinput
          docker-compose exec -T web python manage.py collectstatic --noinput
