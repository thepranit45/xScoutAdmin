version: '3.8'

services:
  web:
    build: .
    container_name: xscout_web
    restart: always
    command: gunicorn dashboard.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    env_file:
      - .env
    # depends_on:
    #   - db  # Uncomment when you switch to PostgreSQL

  nginx:
    image: nginx:latest
    container_name: xscout_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
    depends_on:
      - web

  # Uncomment below to scale for PostgreSQL in the future
  # db:
  #   image: postgres:15
  #   container_name: xscout_db
  #   restart: always
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   environment:
  #     POSTGRES_DB: xscout
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: secret_password

volumes:
  static_volume:
  # postgres_data:
